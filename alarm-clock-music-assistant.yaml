# Music Assistant module: SOAS is a Sendspin player, alarms and music are Music Assistant uris in the alarm_stream_url select.
# Use this module or alarm-clock-url.yaml, one of them is required. This module requires the esp-idf framework.

substitutions:
  ma_player_entity: "media_player.alarm_clock_soas" #entity id of this clock in Music Assistant (the Sendspin player)
  ma_enqueue: "replace" #play, replace, next, replace_next or add

globals:
  - id: ma_request_timestamp
    type: int
    initial_value: '0'
  - id: music_from_ma #music was started from Music Assistant, not from the clock
    type: bool
    initial_value: 'false'

audio_file:
  - id: alarm_sound
    file: ${alarm_file}

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_source:
  - platform: sendspin #Music Assistant streams to this source
    id: sendspin_media_source
    sample_rate: 48000
  - platform: audio_file #local alarm sound, fallback when Music Assistant is not available
    id: local_file_media_source
  - platform: audio_http #Home Assistant announcements, like TTS
    id: http_announcement_source
    buffer_size: 250000

speaker:
  - id: speaker_id
    platform: i2s_audio
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    timeout: never
    buffer_duration: 500ms
  - id: mixer_speaker_id
    platform: mixer
    output_speaker: speaker_id
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_spk_mixer_input
        timeout: never
      - id: media_spk_mixer_input
        timeout: never
  - id: media_spk_resampling_input
    platform: resampler
    output_speaker: media_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    task_stack_in_psram: true
  - id: announcement_spk_resampling_input
    platform: resampler
    output_speaker: announcement_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    task_stack_in_psram: true

media_player:
  - id: media_player_alarm
    platform: speaker_source
    name: Media player alarm
    media_pipeline:
      speaker: media_spk_resampling_input
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      sources:
        - sendspin_media_source
        - local_file_media_source
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_announcement_source
    volume_increment: 0.02
    volume_initial: 0.20
    volume_min: 0.05
    volume_max: 0.95
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 20
          duration: 0.0s
      - wait_until:
          not:
            media_player.is_announcing:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 0
          duration: 1.0s
    on_play:
      - logger.log: "Playback started!"
    on_pause:
      - logger.log: "Playback paused!"
    on_idle:
      - logger.log: "Playback finished!"
      - lambda: |-
          //a local stop sets Sendspin to EXTERNAL_SOURCE, clear it so Music Assistant can push to the clock again (browser, groups)
          id(sendspin_hub).update_state(sendspin::SendspinClientState::SYNCHRONIZED);
    on_turn_off:
      - logger.log: "Playback turned off!"

script:
  - id: play_local_alarm #called by alarm_on_local
    then:
      # Play the local alarm sound, this also takes over from a Sendspin stream
      - media_player.play_media:
          id: media_player_alarm
          media_url: "audio-file://alarm_sound"
  - id: stop_media
    then:
      - script.execute: stop_ma
      - media_player.stop:
      - media_player.stop:
          announcement: true
  - id: play_url #ask Music Assistant to play the selected media on this clock, it is streamed back over Sendspin
    parameters:
      from_cache: bool
    then:
      - lambda: |-
          id(music_from_ma) = false;
          std::string mediaUri = id(alarm_stream_url).current_option();
          ESP_LOGD("play_url", "Configured media uri %s", mediaUri.c_str());
          if (strcmp(mediaUri.c_str(), "Local") == 0) {
            ESP_LOGD("play_url", "Play local alarm sound");
            id(alarm_on_local).turn_on();
            return;
          }
          if (from_cache) {
            mediaUri = id(media_url);
            ESP_LOGD("play_url", "from_cache is true, using cached media uri");
          }
          else {
            id(media_url) = mediaUri; //saving uri to cache
          }
          id(media_player_stopped) = 0;
      - if:
          condition:
            lambda: 'return (std::string(id(alarm_stream_url).current_option()) != "Local");'
          then:
            - if:
                condition:
                  api.connected:
                then:
                  - lambda: |-
                      //a local stop sets Sendspin to EXTERNAL_SOURCE, Music Assistant will not stream to us until that is cleared
                      id(sendspin_hub).update_state(sendspin::SendspinClientState::SYNCHRONIZED);
                  - homeassistant.action:
                      action: music_assistant.play_media
                      data:
                        entity_id: ${ma_player_entity}
                        enqueue: ${ma_enqueue}
                      data_template:
                        media_id: "{{ media_id }}"
                      variables:
                        media_id: !lambda 'return id(media_url);'
                  - lambda: |-
                      id(ma_request_timestamp) = id(ntp).now().timestamp;
                      ESP_LOGD("play_url", "Requested %s on ${ma_player_entity}", id(media_url).c_str());
                else:
                  - logger.log:
                      format: "Home Assistant is not connected, can not reach Music Assistant"
                      level: WARN
                  - if:
                      condition:
                        switch.is_on: alarm_on
                      then:
                        - switch.turn_on: alarm_on_local
  - id: stop_ma #stop Music Assistant playback on this clock, a local stop only detaches the Sendspin stream
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: media_player.media_stop
                data:
                  entity_id: ${ma_player_entity}
  - id: media_player_watchdog
    mode: single
    then:
      - lambda: |-
          //ESP_LOGD("media_player_watchdog", "Media player state %i", id(media_player_alarm).state);
          if (!id(time_sync_done) && !id(boot_done)) {
            //do nothing, time sync and boot needs to be finished
          }
          else if (id(media_player_alarm).state == 2 && !id(alarm_on).state && !id(music_on).state) { //MEDIA_PLAYER_STATE_NONE = 0 , MEDIA_PLAYER_STATE_IDLE = 1 , MEDIA_PLAYER_STATE_PLAYING = 2 , MEDIA_PLAYER_STATE_PAUSED = 3 ,  MEDIA_PLAYER_STATE_ANNOUNCING = 4
            ESP_LOGD("media_player_watchdog", "Media player is playing, alarm_on and music_on are switched off");
            id(media_player_watchdog_count) = id(media_player_watchdog_count) + 1;
            if (id(media_player_watchdog_count) > 1) {
              ESP_LOGD("media_player_watchdog", "Media player is playing, media_player_watchdog_count is %i, enabling music_on", id(media_player_watchdog_count));
              id(media_player_watchdog_count) = 0;
              id(music_on).turn_on();
              id(music_from_ma) = true;
            }
          }
          else if ((id(media_player_alarm).state == 0 || id(media_player_alarm).state == 1) && (id(alarm_on).state || id(music_on).state)) {
            if (id(alarm_on_local).state) {
              return; //the local file loop restarts itself, short gaps between plays are expected
            }
            ESP_LOGD("media_player_watchdog", "Media player is not playing, alarm_on or music_on are switched on");
            if (id(music_from_ma) && !id(alarm_on).state) { //Music Assistant goes idle between tracks, only switch off when it stays idle
              id(media_player_watchdog_count) = id(media_player_watchdog_count) + 1;
              if (id(media_player_watchdog_count) < 2) {
                ESP_LOGD("media_player_watchdog", "Music Assistant playback is idle, waiting for the next track");
                return;
              }
              ESP_LOGD("media_player_watchdog", "Music Assistant playback stopped, switching off music_on");
              id(music_from_ma) = false;
              id(music_on).turn_off();
              return;
            }
            int secondsSinceRequest = id(ntp).now().timestamp - id(ma_request_timestamp);
            if (secondsSinceRequest < 20) { //Music Assistant can take a while to start the Sendspin stream, a new request would restart it
              ESP_LOGD("media_player_watchdog", "Waiting for Music Assistant, requested %i seconds ago", secondsSinceRequest);
              return;
            }
            id(media_player_watchdog_count) = id(media_player_watchdog_count) + 1;
            if (id(media_player_watchdog_count) < 2) {
              ESP_LOGD("media_player_watchdog", "Media player should be playing, trying to play the configured media for count %i", id(media_player_watchdog_count));
              id(play_url).execute(false);
            }
            else if (id(alarm_on).state) {
              ESP_LOGW("media_player_watchdog", "Failed to start stream, enabling alarm_on_local");
              id(alarm_on_local).turn_on();
            }
            else if (id(music_on).state) {
              ESP_LOGE("media_player_watchdog", "Failed to start stream, switching off music_on");
              id(music_on).turn_off();
            }
          }
          else if (id(media_player_watchdog_count) != 0) {
            ESP_LOGD("media_player_watchdog", "Resetting media_player_watchdog_count");
            id(media_player_watchdog_count) = 0;
          }
