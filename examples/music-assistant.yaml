substitutions:
  display_model: "SH1107 128x128"
  display_rotation: "270"
  sun_latitude: 52.37°
  sun_longitude: 4.89°
  i2c_sda: GPIO48
  i2c_scl: GPIO47
  i2s_lrclk_pin : GPIO12
  i2s_bclk_pin: GPIO1
  i2s_dout_pin: GPIO2
  pin_a: GPIO9
  pin_b: GPIO10
  alarm_off_button_pin: GPIO4
  rotary_button_pin: GPIO8
  alarm_file: alarm.flac
  language: "NL"
  alarm_off_button_single_click_time_max: 1s
  alarm_off_button_single_click_time_min: 0.25s
  top_button_long_press_enabled: "true"
  top_button_triple_press_enabled: "true"
  top_button_double_press_enabled: "true"
  timezone: Europe/Amsterdam
  ma_player_entity: "media_player.alarm_clock_soas" #the entity of this clock in Music Assistant
  ma_enqueue: "replace"

packages:
  remote_package_files:
    url: https://github.com/randellmatt/soas
    ref: main
    files: [alarm-clock-soas.yaml, alarm-clock-ds1307.yaml]

time:
  - id: !extend ntp
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

select:
  - id: !extend alarm_media_uri
    options: #Music Assistant uris, copy them from the Music Assistant item url
      - "library://radio/1"
      - "library://playlist/1"
      - "library://album/1"
      - "library://track/1"
      - "Local" #By using the name and option Local, you can define the local file as alarm
  - id: !extend alarm_media_name
    options:
      - "Radio"
      - "Playlist"
      - "Album"
      - "Track"
      - "Local"

esphome:
  name: "alarm-clock-soas"
  friendly_name: "Alarm Clock SOAS"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_BT_ENABLED: "n"
      CONFIG_ESP_WIFI_TASK_CORE_ID: "0"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

api:
  encryption:
    key: "your encryption password"
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "your ota string"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  ap:
    ssid: "alarm-clock-soas"
    password: "your ap password"

network:
  enable_high_performance: false

captive_portal:

psram:
  mode: octal
  speed: 80MHz
